name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 2:00 AM UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  backup:
    name: Backup Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake up Supabase project
        run: |
          curl -sf "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" || true

      # The ubuntu-latest runner ships pg_dump 16, but Supabase runs Postgres 17
      # and pg_dump refuses to dump a newer server. Install the PG 17 client.
      - name: Install PostgreSQL 17 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.DATABASE_URL }}" \
            --no-owner --no-acl \
            -F c \
            -f backup-$(date +%Y-%m-%d).dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backup-*.dump
          retention-days: 90
